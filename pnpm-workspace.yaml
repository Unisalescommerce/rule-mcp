packages:
  - "packages/*"

allowBuilds:
  "@modelcontextprotocol/inspector": false
minimumReleaseAgeExclude:
  - eslint-plugin-unicorn@75.0.0 || 76.0.0
  - "@modelcontextprotocol/inspector@2.9.0"
  - globals@17.13.0
  - "@modelcontextprotocol/sdk@1.32.2"
  - "@isaacs/nonrecursive-glob-match@1.1.0"
  - glob@14.0.4
  - minimatch@11.0.5
  - "@playwright/test@1.65.0"
  - jsdom@31.0.0
  - playwright-core@1.65.0
  - playwright@1.65.0
overrides:
  # Transitive advisories that `@modelcontextprotocol/sdk` has not caught up
  # to. Overrides, not ranges: the pin is the remediation, and the audit gate
  # reads the resolved tree.
  # (GHSA-hrr3-gc8f-f4qj fast-uri: vulnerable range >=3.0.0 <3.1.8; the
  # 3.1.9 advisories GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h,
  # GHSA-wjr9-j795-jxcr and GHSA-333x-w4r6-6crp raise the floor)
  # rule-mcp link override retired: package lives in packages/mcp (workspace:*)
  fast-uri: 4.2.3
  # Two dev-only advisories whose owners have not moved: `c8` pulls glob 13 and
  # `eslint` pins minimatch ^10. Both fixes are a major the parent refuses, so
  # the override is the remediation and the audit gate reads the resolved tree.
  # (GHSA-5j98-mcp5-4vw2 glob; GHSA-g3hv-75wg-m249 minimatch)
  glob: 14.0.4
  minimatch: 11.0.5
